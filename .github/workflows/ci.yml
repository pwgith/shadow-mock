name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint (golangci-lint, file names, TODOs, go mod tidy, govulncheck)
        run: make lint

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the mapping corpus
        run: node scripts/check-corpus.js

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Live OpenAPI contract (builds the engine and calls every operation)
        run: make contract-live

  test:
    runs-on: ubuntu-latest
    # The database tests need a real Postgres. They skip without the DSN, and the coverage gate counts them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadowmock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHADOWMOCK_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/shadowmock?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit and acceptance tests with race detector and coverage targets
        run: make cover-check

  # The S3 driver's fault tests use Shadow Mock as a failing object store. They run against the engine built from this
  # tree in the test job; this job runs them again against the latest published edge build, a separate binary.
  s3-against-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download the latest edge build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/edge"
          gh release download edge --repo "$GITHUB_REPOSITORY" --pattern '*_linux_amd64.tar.gz' --pattern SHA256SUMS --dir "$RUNNER_TEMP/edge"
          cd "$RUNNER_TEMP/edge"
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf ./*_linux_amd64.tar.gz
          echo "SHADOWMOCK_EDGE_BIN=$(find "$RUNNER_TEMP/edge" -name shadowmock -type f | head -1)" >> "$GITHUB_ENV"
      - name: S3 driver against the edge build
        run: go test ./internal/blob/s3/... -count=1 -v

  # Real WireMock is the reference. Every corpus request is replayed against Shadow Mock and
  # WireMock and the replies and journals compared, and the client suite must pass on both.
  wiremock-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Start WireMock
        run: WIREMOCK_HOME="$RUNNER_TEMP/wiremock" bash scripts/wiremock-reference.sh start
      - name: Replay the corpus, the admin API and the wire behaviour against Shadow Mock and WireMock and compare
        run: |
          SHADOWMOCK_WIREMOCK_URL=http://localhost:18080 SHADOWMOCK_WIREMOCK_CORS_URL=http://localhost:18082 SHADOWMOCK_WIREMOCK_TLS_PLAIN_URL=http://localhost:18083 SHADOWMOCK_WIREMOCK_TLS_URL=https://localhost:18443 SHADOWMOCK_WIREMOCK_PROXY_URL=http://localhost:18084            go test ./test/conformance -run 'TestDifferentialAgainstRealWireMock|TestAdminAPIMatchesWireMock|TestWireBehaviourMatchesWireMock|TestRecordingMatchesWireMock|TestTLSMatchesWireMock|TestBrowserProxyMatchesWireMock|TestProxyingCorpusMatchesWireMock|TestProxyHeaderRulesDifferFromWireMock' -count=1
      - name: Client suite against WireMock (every expectation in it must hold there)
        run: BASE_URL=http://localhost:18081 node --test test/client/compat.test.mjs
      - name: Client suite against Shadow Mock
        run: |
          go build -o shadowmock ./cmd/shadowmock
          mkdir -p "$RUNNER_TEMP/sm-root"
          ./shadowmock --port 18090 --root-dir "$RUNNER_TEMP/sm-root" &
          for _ in $(seq 1 30); do curl -fs http://localhost:18090/__health >/dev/null && break; sleep 1; done
          BASE_URL=http://localhost:18090 node --test test/client/compat.test.mjs
      - name: WireMock logs
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP"/wiremock/*.log || true
