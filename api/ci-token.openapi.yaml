openapi: 3.1.0
info:
  title: Shadow Mock CI Token Exchange
  version: 0.1.0
  summary: Exchange a CI key for a short-lived Clerk M2M JWT.
  description: |
    Served by the Shadow Mock management app (Next.js on Vercel), not the engine.
    It follows the OAuth 2.0 client-credentials grant (RFC 6749 §4.4), so standard OAuth tooling works.
    The returned token is used as `Authorization: Bearer <token>` on the engine admin API
    (`api/openapi.yaml`). Design: docs/SAAS.md §3.6. Specs: features/05_management_app/ci_token_exchange.feature.

    * A token is valid for up to 3600 s. While the key's last token has more than 10 minutes left,
      the same token is returned instead of minting a new one.
    * Revoking the CI key in the management app stops new tokens immediately.
    * Rate limits: 60 requests a minute per key and 300 per source IP, with back-off after repeated
      `invalid_client` responses.
    * If the org's IP allowlist has `applyToAdmin` on, the caller's IP must be in it.
  license:
    name: Proprietary

servers:
  - url: https://shadowmock.app.kaizentis.xyz
    description: Management app (final host is set by the platform)

paths:
  /api/ci/token:
    post:
      operationId: exchangeCIKey
      summary: Exchange CI key credentials for an access token
      security:
        - ciKeyBasic: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TokenRequest' }
            examples:
              basicAuth:
                summary: Credentials in the Authorization header
                value: { grant_type: client_credentials }
              formFields:
                summary: Credentials in the form body
                value:
                  grant_type: client_credentials
                  client_id: ck_ACME0000000000000
                  client_secret: cks_EXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLEEXAMPLEEX
      responses:
        '200':
          description: Token issued (or reused).
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: Malformed request or unsupported grant type.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
              examples:
                unsupportedGrant: { value: { error: unsupported_grant_type } }
        '401':
          description: Unknown, revoked or expired key, or wrong secret. The response never reveals which.
          headers:
            WWW-Authenticate:
              schema: { type: string, examples: ['Basic realm="shadowmock-ci"'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
              examples:
                invalidClient: { value: { error: invalid_client } }
        '403':
          description: The caller's IP is not in the org's allowlist (`applyToAdmin` on).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
              examples:
                ipNotAllowed: { value: { error: access_denied, error_description: ip_not_allowed } }
        '429':
          description: Rate limited.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
              examples:
                slowDown: { value: { error: slow_down } }

components:
  securitySchemes:
    ciKeyBasic:
      type: http
      scheme: basic
      description: '`client_id` as the user name and `client_secret` as the password.'

  schemas:
    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: { type: string, const: client_credentials }
        client_id:
          type: string
          pattern: '^ck_[0-9A-Z]{16}$'
          description: Required unless sent with HTTP Basic.
        client_secret:
          type: string
          pattern: '^cks_[0-9A-Z]{52}$'
          description: Required unless sent with HTTP Basic.
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: |
            Clerk M2M JWT with claims `org_id`, `org_role` (`org:member`) and `ci_key_id`.
            It is verified by the engine against Clerk's JWKS.
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, maximum: 3600, description: Seconds until expiry. Lower when a cached token is reused. }
    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, unsupported_grant_type, access_denied, slow_down]
        error_description: { type: string }
